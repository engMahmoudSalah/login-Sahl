<body>
    <div class="all">

        <div class='shape'>
            <div class="ani"></div>
        </div>

        <div class="container" role="main">
            <div class="ani2"></div>
            <div class="header">
                <h2 aria-level="1">تسجيل الدخول</h2>
                <img class="img1" src="./img/logo.png" alt="">
                <div class="toggle-theme">
                    <button class="btn btn1 active">Light</button>
                    <button class="btn btn2 ">Dark</button>
                </div>

            </div>

            <div class="main">

                <div class="logo">
                    <img style="height: 50%;" src="img/name.png" alt="">
                    <img src="img/logo.png" alt="">
                </div>

                <form class="form">
                    <!-- !phone number -->
                    <div class="item">
                        <label style="align-self: self-start;" for="">رقم الهاتف</label>
                        <div class="input">

                            <div class="mainInput">
                                <input type="text" inputmode="numeric" autocomplete="tel" pattern="[0-9]*" name="" id="numberInput" oninput="validateNumber()" placeholder="مثال : 01012345678">
                                <img class="done" style="display: none;"  src="img/checkmark.png" alt="">
                            </div>

                            <div id="dangerNum"></div>

                        </div>
                    </div>

        
                    <div class="item">
                        <!-- !password -->
                        <div class="div-pass">
                            <label for="">كلمة المرور </label>
                            <a class="reset link" href="reset.html">نسيت كلمة السر؟</a>
                        </div>

                        <div class="input">
                            <div class="mainInput">
                                <input type="password" pattern="[0-9a-zA-Z!@#$%&*,.?]*" id="passwordInput" placeholder="*********" oninput="validatePassword()">
                                
                                <img id="eyeIcon" onclick="togglePasswordVisibility()" src="img/eye.png" alt="">
                                <img class="done" style="display: none;" id="eyeIcon" onclick="togglePasswordVisibility()" src="img/checkmark.png" alt="">
                           </div>

                           <div id="dangerPass"></div>

                        </div>
                    </div>
        
                    <div class="item">
                        <button class="submit" type="submit" id="submit">تسجيل الدخول</button>
                        <p> لست مشرك؟<a class="link" href="signup.html">انشئ حساب</a></p>
                    </div>
        
                </form>
            </div>

            <div class="header">
                <a class="reset link" href="help.html">تحتاج الي المساعدة؟</a>
                <a class="reset link" href="home.html">الصفحة الرئيسية </a>
            </div>

            
        </div>
    </div>
